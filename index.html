<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e8e7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="兔兔动起来"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>兔兔动起来</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#3f3537;background:#fff9f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:25px 18px 50px}h1{font-size:27px;margin:8px 0}p{line-height:1.65}.muted{color:#8c7c80;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center}.pill{background:#f5e5e4;color:#9d626d;padding:8px 12px;border-radius:40px;font-size:12px}.card{background:white;border:1px solid #f0e1e1;border-radius:23px;padding:22px;margin-top:18px;box-shadow:0 8px 25px #8e5c6510}.center{text-align:center}.emoji{font-size:54px;margin:12px}.name{font-size:23px;font-weight:700}.timer{font-size:70px;letter-spacing:-3px;font-weight:700;font-variant-numeric:tabular-nums;margin:17px 0 5px}.progress{height:9px;background:#f4e9e9;border-radius:10px;overflow:hidden;margin:20px 0}.fill{background:#ca8493;height:100%;width:0;transition:width .2s}.buttons{display:flex;gap:9px}button{border:1px solid #e8cfd3;background:white;color:#7e5660;border-radius:14px;padding:13px;font-size:15px;font-weight:650;cursor:pointer;min-height:46px}button.primary{background:#bd7888;color:white;border-color:#bd7888;flex:2}button.secondary{flex:1}button:disabled{opacity:.4}button:focus-visible,input:focus-visible{outline:3px solid #bb8391;outline-offset:2px}.list{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{padding:11px;border:1px solid #f1e6e6;border-radius:12px;display:flex;gap:8px;align-items:center;font-size:13px}.item.active{background:#fff0f0}.item span:last-child{margin-left:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.setting{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.setting input[type=time]{font-size:16px;border:1px solid #e8cfd3;border-radius:10px;padding:9px;color:#4e3a3d;background:white}.smallbutton{font-size:13px;padding:9px 12px;min-height:40px}.notice{font-size:12px;color:#8c7c80}.complete{background:#fff2e9;border-radius:14px;padding:13px;margin-top:12px;text-align:center}.hidden{display:none}.stat{font-weight:700;color:#a96877}@media(max-width:370px){.list{grid-template-columns:1fr}.timer{font-size:60px}}
</style></head><body><main class="wrap"><div class="top"><div class="muted">🐰 BUNNY MOVE · v0.1</div><span class="pill" id="status">今日待运动</span></div><h1>兔兔动起来</h1><p class="muted">不用找视频。每天8分钟，跟着做就好 ♡</p><section class="card"><div class="row muted"><span id="step">动作 1 / 8</span><span id="phase">运动45秒 · 休息15秒</span></div><div class="center"><div class="emoji" id="emoji">🙆‍♀️</div><div class="name" id="name">肩部绕环</div><p class="muted" id="detail">站直，双肩缓慢向后绕圈</p><div class="timer" id="timer">00:45</div><div class="muted" id="hint">准备好了就开始</div></div><div class="progress"><div class="fill" id="fill"></div></div><div class="buttons"><button id="start" class="primary">▶ 开始运动</button><button id="skip" class="secondary">下一项 →</button></div><div class="row" style="margin-top:15px"><label class="muted"><input type="checkbox" id="sound" checked> 每秒轻滴答</label><button id="reset" class="smallbutton">重新开始</button></div><div id="complete" class="complete hidden">🏅 今日打卡成功。小兔子真棒 ♡</div></section><section class="card"><div class="row"><strong>今日动作</strong><span class="muted" id="count">0 / 8</span></div><div class="list" id="list" style="margin-top:15px"></div></section><section class="card"><div class="row"><strong>打卡记录</strong><span class="stat" id="streak">连续 0 天</span></div><p class="muted" id="history">完成一次训练后，这里就会留下记录。</p></section><section class="card"><strong>每日提醒时间</strong><div class="setting" style="margin-top:12px"><input id="remindTime" type="time" value="20:30"><button id="saveTime" class="smallbutton">保存时间</button></div><p class="notice" id="remindNote">当前版本仅在网页打开时检查时间并提示；关闭网页后不会自动推送。正式推送需要后续接入服务端。</p></section><p class="notice" style="margin-top:18px">温柔提醒：不必追求速度，动作保持舒适。疼痛、头晕或明显不适时停止。计时与声音需要网页保持打开；手机锁屏可能暂停播放。</p></main><script>
(()=>{'use strict';const moves=[['🙆‍♀️','肩部绕环','双肩缓慢向后绕圈，自然呼吸'],['🚶','原地踏步','自然摆臂，交替抬脚'],['🪑','椅子坐站','使用稳固椅子，慢慢坐下再站起'],['🧱','靠墙俯卧撑','双手扶墙，屈肘靠近再推回'],['🦵','站姿提踵','扶稳桌边，踮起脚尖再落下'],['🧍','站姿髋部后移','微屈膝，臀部向后，背部自然'],['🚶','原地快走','加快脚步，保持能够说话的强度'],['🌿','舒缓伸展','轻轻伸展肩膀和小腿，放松呼吸']];const $=id=>document.getElementById(id);let index=0,phase='work',remaining=45,running=false,done=false,ticker=null,nextAt=0,ctx=null;const dateKey=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const load=()=>{try{return JSON.parse(localStorage.getItem('bunny-dates')||'[]')}catch{return []}};const store=a=>{try{localStorage.setItem('bunny-dates',JSON.stringify(a))}catch{}};function play(){if(!$('sound').checked)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=660;g.gain.value=.023;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.045)}catch{}}function renderHistory(){const a=load().sort(),today=dateKey();let count=0;const cur=new Date();if(!a.includes(today))cur.setDate(cur.getDate()-1);while(a.includes(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`)){count++;cur.setDate(cur.getDate()-1)}$('streak').textContent=`连续 ${count} 天`;$('history').textContent=a.length?`累计打卡 ${a.length} 天 · 最近一次 ${a[a.length-1]}`:'完成一次训练后，这里就会留下记录。'}function finish(){done=true;running=false;clearInterval(ticker);ticker=null;const a=load(),k=dateKey();if(!a.includes(k)){a.push(k);store(a)}renderHistory();render()}function render(){const m=moves[Math.min(index,7)];$('step').textContent=done?'完成训练':`动作 ${index+1} / 8`;$('phase').textContent=done?'今日完成':phase==='work'?'运动45秒':'休息15秒';$('emoji').textContent=done?'🏅':phase==='rest'?'💧':m[0];$('name').textContent=done?'今天也做到了':phase==='rest'?'休息一下':m[1];$('detail').textContent=done?'明天再来一点点':phase==='rest'?`接下来：${moves[Math.min(index+1,7)][1]}`:m[2];$('timer').textContent=done?'✓':`00:${String(remaining).padStart(2,'0')}`;$('hint').textContent=done?'今天的任务完成啦':running?'慢慢来，不用着急':index===0&&remaining===45?'准备好了就开始':'已暂停';$('fill').style.width=`${done?100:(phase==='work'?(45-remaining)/60:(45+15-remaining)/60)*100}%`;$('status').textContent=done?'今日已完成':running?'正在运动':'今日待运动';$('start').textContent=done?'✓ 已完成':running?'Ⅱ 暂停':index===0&&remaining===45?'▶ 开始运动':'▶ 继续运动';$('start').disabled=done;$('skip').disabled=done;$('count').textContent=`${done?8:index} / 8`;$('list').innerHTML=moves.map((m,i)=>`<div class="item ${!done&&i===index?'active':''}"><span>${m[0]}</span><span>${m[1]}</span><span>${done||i<index?'✓':i===index?'●':'○'}</span></div>`).join('');$('complete').classList.toggle('hidden',!done)}function pause(){running=false;clearInterval(ticker);ticker=null;render()}function advance(){if(phase==='work'&&index===7){finish();return}if(phase==='work'){phase='rest';remaining=15}else{index++;phase='work';remaining=45}}function tick(){if(!running)return;const now=Date.now();if(now<nextAt)return;let steps=Math.min(480,Math.floor((now-nextAt)/1000)+1);nextAt+=steps*1000;while(steps-->0&&!done){remaining--;if(remaining<=0)advance()}if(done)return;play();render()}$('start').onclick=()=>{if(done)return;if(running){pause();return}running=true;nextAt=Date.now()+1000;try{if(ctx&&ctx.state==='suspended')ctx.resume()}catch{}ticker=setInterval(tick,100);render()};$('skip').onclick=()=>{if(done)return;advance();if(running)nextAt=Date.now()+1000;render()};$('reset').onclick=()=>{pause();index=0;phase='work';remaining=45;done=false;render()};$('remindTime').value=localStorage.getItem('bunny-remind')||'20:30';$('saveTime').onclick=()=>{const t=$('remindTime').value;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(t))return;$('remindNote').textContent=`已保存 ${t}。注意：只有页面保持打开时才会出现提醒，关闭后不会推送。`;try{localStorage.setItem('bunny-remind',t)}catch{}};let lastPrompt='';setInterval(()=>{const d=new Date(),t=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,k=dateKey();if(t===$('remindTime').value&&!load().includes(k)&&lastPrompt!==k){lastPrompt=k;$('remindNote').textContent='🐰 运动时间到啦，今天只需要8分钟。';$('status').textContent='该运动啦'}},10000);render();renderHistory();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});})();
</script></body></html>
